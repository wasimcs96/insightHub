    <script>
        const perPageMap = {};
        let rowsPerPage = 10;

        document.addEventListener('DOMContentLoaded', function() {

        let currentSort = 'name'; // Default sorting column (e.g., 'name')
        let currentOrder = 'asc'; // Default sorting order (e.g., 'asc')
        // Sorting function
        function sortTable(column) {
            const sortableHeader = $(`.sortable-header[data-column="${column}"]`);
            // Determine if the clicked column is the same as the current sort column
            if (currentSort === column) {
                // Toggle the sorting order (asc/desc)
                currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
                // $this.data('sort', 'desc');
            } else {
                // If a new column is clicked, set it as the sorting column and default to ascending order
                currentSort = column;
                currentOrder = 'asc';
                // $this.data('sort', 'asc');
            }
            sortableHeader.data('sort', currentOrder);

            // Update the sorting icon color based on the current order
            updateSortIcons(sortableHeader, currentOrder);

            loadTechnicalSkills(getSelectedCategoryId(), 1, selectedLetter, selectedLevel, currentSort, currentOrder);
        }

        function updateSortIcons(header, order) {
            // Hide all sort icons
            $('.sortable-header').find('.sort-icon .sort-up path, .sort-icon .sort-down path').css('stroke', 'grey');

            // $header.find('.sort-icon .sort-up path, .sort-icon .sort-down path').css('stroke', 'transparent');

            // Apply the color based on the sorting order (orange for both asc and desc)
            if (order === 'asc') {
                header.find('.sort-icon .sort-up path').css('stroke', 'orange'); // Show up arrow
                header.find('.sort-icon .sort-down path').css('stroke', 'grey'); // Show down arrow

            } else if (order === 'desc') {
                header.find('.sort-icon .sort-down path').css('stroke', 'orange'); // Show down arrow
                header.find('.sort-icon .sort-up path').css('stroke', 'grey'); // Show up arrow

            }
        }

        $('.sortable-header').on('click', function() {
            const column = $(this).data('column'); // Get the column associated with this header
            sortTable(column);
        });


        let currentRequestId = 0;

        let currentAbortController = null;

        function loadTechnicalSkills(categoryId, page, letter = selectedLetter, level = selectedLevel, sort = null, order =
            null) {
            if (currentAbortController) {
                currentAbortController.abort();
            }

            // Create new AbortController for current request
            currentAbortController = new AbortController();
            const signal = currentAbortController.signal;

            // Increment request ID to track the latest one
            const requestId = ++currentRequestId;

            showOverlay();

            const search = document.getElementById('search_job_title').value;
            const departmentIds = Array.from(selectedDepartments);

            const urlParams = new URLSearchParams(window.location.search);
            // const sort = urlParams.get('sort') || '';
            // const order = urlParams.get('order') || '';

            const perPage = perPageMap['default'] || 10;

            let url =
                `/admin/company/technical/skill/fetch?page=${page}&search=${search}&letter=${letter}&category_id=${categoryId}&level=${level}&department_ids=${departmentIds.join(',')}&per_page=${perPage}&sort=${sort}&order=${order}`;

            let deptPerPageParams = '';
            Object.entries(perPageMap).forEach(([dept, value]) => {
                if (dept !== 'default') {
                    deptPerPageParams += `&per_page_dept_${dept}=${value}`;
                }
            });

            url += deptPerPageParams;

            console.log('Selected departments before fetch:', departmentIds);
            console.log('Final fetch URL:', url);



            fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    signal: signal
                })
                .then(response => response.json())
                .then(data => {
                    if (requestId !== currentRequestId) return;

                    if (data.visibleLetters) {
                        updateLetters(data.visibleLetters);
                    }

                    const countEl = document.getElementById('technical_skill_found');

                    if (departmentIds.length > 0 && data.skillsByDept && Object.keys(data.skillsByDept).length > 0) {
                        renderDeptTables(data.skillsByDept);

                        let total = 0;
                        Object.values(data.skillsByDept).forEach(dept => {
                            total += dept.pagination?.total || 0;
                        });

                        if (countEl) countEl.textContent = total;
                    } else {
                        updateSkillsTable(data.technicalSkills);
                        if (countEl) countEl.textContent = data.technicalSkills.total ?? 0;
                    }

                    updatePagination(data.pagination, page);
                    hideOverlay();
                });

        }


        function renderPaginationWithRowsDropdown(container, deptId) {
            const wrapper = container.querySelector('.pagination-wrapper');
            if (!wrapper) return;

            const leftDiv = wrapper.querySelector('.d-flex.align-items-center.gap-2');
            if (!leftDiv) return;

            // Clear any existing dropdown
            leftDiv.innerHTML = '';

            // Create dropdown HTML
            const dropdownHTML = `
                <label for="rowsPerPageSelect_${deptId}">Rows per page:</label>
                <select id="rowsPerPageSelect_${deptId}" class="form-select form-select-sm" style="width: auto;">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            `;

            leftDiv.innerHTML = dropdownHTML;

            const dropdown = leftDiv.querySelector(`#rowsPerPageSelect_${deptId}`);
            dropdown.value = perPageMap[deptId] || 10;

            dropdown.addEventListener('change', function() {
                perPageMap[deptId] = parseInt(this.value);
                loadTechnicalSkills(getSelectedCategoryId(), 1, selectedLetter, selectedLevel);
            });
        }

                        ' '));

                navElement = document.createElement('nav');
                navDiv = document.createElement('div');

                navDiv.classList.add(...'pagination mb-0'.split(' '));
                navElement.appendChild(navDiv);

                paginationDiv.appendChild(rowsDiv);
                paginationDiv.appendChild(navElement);


                borderMain.appendChild(table);
                borderMain.appendChild(paginationDiv);

            // Render skill rows
            const tableBody = table.querySelector('tbody');

                    `;
                    for (let i = 1; i <= 6; i++) {
                        row +=
                            `<td class="checkmark">${skill[`level_${i}_description`] ? '<iconify-icon icon="prime:check-circle" width="24" height="24"></iconify-icon>' : ''}</td>`;
                    }
                    row += `

                            </div>

                        </tr>
                    `;
                    tableBody.innerHTML += row;

            }

            // Render or refresh pagination and dropdown
            if (!perPageMap['default']) perPageMap['default'] = 10;
            renderPaginationWithRowsDropdown(container, 'default');
        }

        function updateDepartments(departments) {
            const list = document.getElementById('optionsList');
            list.innerHTML = departments.map(d => `
                <label class="checkbox-option">
                <input type="checkbox" value="${d.id}" ${selectedDepartments.has(d.id.toString()) ? 'checked' : ''}>
                ${d.name}
                </label>
            `).join('');

            list.querySelectorAll('input[type=checkbox]').forEach(cb => {
                cb.addEventListener('change', () => {
                    syncSelectedDepartments();
                });
            });

            document.getElementById('selectedLabel').textContent =
                `${selectedDepartments.size} Job Famil${selectedDepartments.size !== 1 ? 'ies' : 'y'} selected`;
        }

        function updatePagination(pagination, currentPage) {
            console.log('Updating pagination for page', currentPage, pagination);

            const paginationLinks = document.getElementById('pagination-links');

            if (!paginationLinks) {
                console.warn('Pagination element not found, skipping update.');
                return;
            }
            paginationLinks.innerHTML = ''; // Clear existing pagination

            const container = document.getElementById('pagination-container');
            if (container) {
                container.innerHTML = html;
            }

            const maxPageNumbersToShow = 5;
            let pageNumbers = [];

            const lastPage = pagination.last_page || 1;
            const currentPageNumber = pagination.current_page || 1;

            if (lastPage > maxPageNumbersToShow) {
                if (currentPageNumber <= 3) {
                    pageNumbers = [1, 2, 3, 4, '...', lastPage];
                } else if (currentPageNumber >= lastPage - 2) {
                    pageNumbers = [1, '...', lastPage - 3, lastPage - 2, lastPage - 1, lastPage];
                } else {
                    pageNumbers = [1, '...', currentPageNumber - 1, currentPageNumber, currentPageNumber + 1, '...',
                        lastPage
                    ];
                }
            } else {
                for (let i = 1; i <= lastPage; i++) {
                    pageNumbers.push(i);
                }
            }

            if (pagination.prev_page_url) {
                paginationLinks.innerHTML += `<li class="page-item">
            <a class="page-link" href="#" data-page="${currentPageNumber - 1}">&laquo;</a>
            </li>`;
            } else {
                paginationLinks.innerHTML += `<li class="page-item disabled">
                <span class="page-link">&laquo;</span>
            </li>`;
            }

            pageNumbers.forEach(page => {
                if (page === '...') {
                    paginationLinks.innerHTML +=
                        `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                } else {
                    paginationLinks.innerHTML += `<li class="page-item ${currentPageNumber === page ? 'active' : ''}">
                    <a class="page-link" href="#" data-page="${page}">${page}</a>
                </li>`;
                }
            });

            if (pagination.next_page_url) {
                paginationLinks.innerHTML += `<li class="page-item">
                <a class="page-link" href="#" data-page="${currentPageNumber + 1}">&raquo;</a>
            </li>`;
            } else {
                paginationLinks.innerHTML += `<li class="page-item disabled">
                <span class="page-link">&raquo;</span>
            </li>`;
            }
        }

        function getSelectedCategoryId() {
            const activeCategory = document.querySelector('.category-item.active');
            return activeCategory ? activeCategory.dataset.categoryId : null;
        }

        function updateLetters(visibleLetters) {
            const letterList = document.getElementById('letter-results');
            const leftButton = document.querySelector('.scroll-btn.left');
            const rightButton = document.querySelector('.scroll-btn.right');

            letterList.innerHTML = '';

            letterList.innerHTML += `
                <a href="#" class="tab-button-bottom ${!selectedLetter ? 'bg-active' : ''}">
                    <p>ALL</p>
                </a>
            `;

            visibleLetters.forEach(letter => {
                const isActive = selectedLetter === letter;
                letterList.innerHTML += `
                    <a href="#" class="tab-button-bottom ${isActive ? 'bg-active' : ''}">
                        <p>${letter}</p>
                    </a>
                `;
            });

            if (visibleLetters.length < 5) {
                leftButton.style.display = 'none';
                rightButton.style.display = 'none';
            } else {
                leftButton.style.display = 'block';
                rightButton.style.display = 'block';
            }
        }

            });
            const year = date.getFullYear();

            const hours = date.getHours();
            const minutes = String(date.getMinutes()).padStart(2, '0');

            const formattedHours = hours % 12 || 12; // 12-hour format, converting 0 to 12 for midnight

    <script>
        function toggleDropdownTable(button) {
            console.log('buttonsssssssss', button);
            const menu = button.nextElementSibling;
            const rect = button.getBoundingClientRect(); // Get the button's position

            document.querySelectorAll('.dropdown-menu').forEach(m => {
                if (m !== menu) m.style.display = 'none';
            });

            const spaceBelow = window.innerHeight - rect.bottom; // Calculate the space below the button
            const spaceAbove = rect.top; // Calculate the space above the button

            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.actions')) {
                document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
            }
        });

        function filterJobdescOptions(input) {

            const jobdescDropdown = wrapper.querySelector('.jobdesc-dropdown');

            console.log('jobdescSelect:', jobdescSelect);
            console.log('jobdescDropdown:', jobdescDropdown);

                console.error('Error: Job description elements not found');
                return;
            }

            const jobdescEl = document.getElementById('jobdesc');
            if (jobdescEl) {
                const target = jobdescEl.querySelector('.some-class'); // or whatever you're accessing
                if (target) {
                    target.classList.remove('active'); // or other safe access
                }
            }

            const jobdescLabel = jobdescSelect.querySelector('.jobdesc-label');
            if (jobdescLabel) {
                jobdescLabel.textContent = '0 selected';
            } else {
                console.warn('Job description label not found');
            }

            setTimeout(() => {
                const checkboxes = jobdescDropdown.querySelectorAll('.options-list input[type="checkbox"]:checked');
                console.log('checkboxxxxxxxxxxxxxx', checkboxes);

                if (checkboxes.length > 0) {
                    checkboxes.forEach(checkbox => {

                    });
                } else {
                    console.warn('No checkboxes found in the job description dropdown');
                }
                applyJobdescFilter(wrapper);

                wrapper.classList.remove('open');
            }, 100); // Wait for 100ms to ensure the checkboxes are rendered (you can adjust this delay as needed)
        }

        function attachResetButtonEventListener() {
            document.querySelectorAll('.btn-reset').forEach(button => {
                button.addEventListener('click', function(event) {
                    const wrapper = button.closest('.jobdesc-wrapper');
                    resetJobdescSelection(wrapper);
                });
            });
        }

        function debounce(func, delay) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    func.apply(this, args);
                }, delay);
            };
        }
    </script>

                                },
                                onSubmit(modalEl) {
                                    const selectedRadio = modalEl.querySelector(
                                        '.modal-body input[type="radio"]:checked');

                                    if (selectedRadio) {
                                        const radioValue = selectedRadio
                                        .value; // Get the value of the selected radio button
                                        console.log('Radio Value:', radioValue);

                                        if (radioValue === 'duplicate') {

                                            ModalManager.open({
                                                module: 'company_skill_library',
                                                key: "duplicate_technical_skill",
                                                data: {
                                                    skillName: skillName,
                                                },
                                                onSubmit(modalEl1) {
                                                    const newTitle = document
                                                        .getElementById('skillInput').value.trim();

                                                    const errorText = document
                                                        .getElementById(
                                                            'errorText');

                                                    if (!newTitle) {
                                                        errorText.style.display =
                                                            'block';
                                                        return;
                                                    }

                                                    errorText.style.display = 'none';

                                                    const currentSkillId = skillId;

                                                    const baseUrl =
                                                        `/admin/company/sector-skills/duplicate/${skillId}`;
                                                    const redirectUrl =
                                                        `${baseUrl}?duplicate=true&new_title=${encodeURIComponent(newTitle)}`;
                                                    window.location.href = redirectUrl;

                                                }
                                            });

                                            const bsModal = bootstrap.Modal.getInstance(
                                            modalEl);
                                            if (bsModal) bsModal.hide();

                                        } else if (radioValue === 'overwrite') {
                                            // If the "overwrite" option is selected, redirect the user
                                            window.location.href =
                                                `/admin/company/sector-skills/edit/${skillId}`; // Replace with the actual redirect URL
                                        }
                                    } else {
                                        console.log('No radio button selected');
                                    }



                                },
                                onShown(modalEl) {
                                    const radios = modalEl.querySelectorAll(
                                        '.modal-body input[type="radio"]');
                                    const proceedBtn = modalEl.querySelector(
                                        '#disabledProceedBtn');
                                    proceedBtn.disabled = true;

                                    radios.forEach(radio => {
                                        radio.addEventListener('change', () => {
                                            // Enable/Disable the button based on the selected radio option
                                            proceedBtn.disabled = !radio
                                            .checked;

                                            if (radio.checked) {
                                                proceedBtn.classList.remove(
                                                    'disable-grey-popup');
                                            } else {
                                                proceedBtn.classList.add(
                                                    'disable-grey-popup');
                                            }
                                        });
                                    });

                                }
                            });
                        })
                        .catch(error => {
                            console.error('Error fetching related jobs:', error);
                        });





                }

            });
        });
    </script>
