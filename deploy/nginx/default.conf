server {
    # Listen
    listen 80;
    listen [::]:80;

    server_name localhost;  # or: talent-assessment-dev-mynext.cxsanalytics.com
    root /usr/share/nginx/html/public;
    index index.php index.html index.htm;

    access_log  /var/log/nginx/app.log combined;
    error_log   /var/log/nginx/app.error.log error;

    # Basic hardening & gzip
    server_tokens off;
    sendfile off;

    gzip on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml application/json text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\\.";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html/public; }

    # PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # ✅ point to PHP 8.0 FPM
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # or use TCP if you prefer:
        # fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        include fastcgi_params;

        # Use realpath to avoid symlink issues
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Optional timeouts for slow ops
        fastcgi_read_timeout 180;
        fastcgi_send_timeout 180;
    }

    # Deny dotfiles
    location ~ /\. {
        log_not_found off;
        deny all;
    }
}
